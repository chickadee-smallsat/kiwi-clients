name: build-desktop-platform

# Reusable workflow: builds the Tauri bundle for a single platform and uploads
# it as an artifact. Called once per platform from desktop-build.yml.
on:
  workflow_call:
    inputs:
      os:
        description: Runner image
        required: true
        type: string
      artifact_name:
        description: Artifact suffix (plotly-client-<artifact_name>)
        required: true
        type: string
      dist_script:
        description: npm script in plotly-app that builds the bundle
        required: true
        type: string
      artifact_path:
        description: Glob of bundle files to upload
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed for the Tauri CLI and for plotly-client's build script, which
      # builds the kiwi-3d frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plotly-app/package-lock.json
            plotly-client/kiwi-3d/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.artifact_name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev pkg-config build-essential patchelf file

      # tauri.conf.json takes its version from plotly-app/package.json
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Using package version: ${VERSION}"
          npm --prefix plotly-app version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Install Node dependencies
        run: npm --prefix plotly-app ci

      - name: Build Tauri bundle
        run: npm --prefix plotly-app run ${{ inputs.dist_script }}

      # Installer names already carry the architecture (_x64-setup / _arm64-setup)
      - name: Zip Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem target/release/bundle/nsis/*.exe) {
            Compress-Archive -Path $f.FullName -DestinationPath "$($f.DirectoryName)\$($f.BaseName).zip"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plotly-client-${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
