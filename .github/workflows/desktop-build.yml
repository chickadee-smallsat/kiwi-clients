name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the AppImage runs on distros with an older glibc
          - os: ubuntu-22.04
            artifact_name: linux
            dist_script: dist:linux
            artifact_path: target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact_name: windows
            dist_script: dist:win
            artifact_path: target/release/bundle/nsis/*.zip
          - os: windows-11-arm
            artifact_name: windows-arm64
            dist_script: dist:win
            artifact_path: target/release/bundle/nsis/*.zip
          - os: macos-latest
            artifact_name: macos
            dist_script: dist:mac
            artifact_path: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed for the Tauri CLI and for plotly-client's build script, which
      # builds the kiwi-3d frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plotly-app/package-lock.json
            plotly-client/kiwi-3d/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact_name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev pkg-config build-essential patchelf file

      # tauri.conf.json takes its version from plotly-app/package.json
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Using package version: ${VERSION}"
          npm --prefix plotly-app version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Install Node dependencies
        run: npm --prefix plotly-app ci

      - name: Build Tauri bundle
        run: npm --prefix plotly-app run ${{ matrix.dist_script }}

      # Installer names already carry the architecture (_x64-setup / _arm64-setup)
      - name: Zip Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem target/release/bundle/nsis/*.exe) {
            Compress-Archive -Path $f.FullName -DestinationPath "$($f.DirectoryName)\$($f.BaseName).zip"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plotly-client-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plotly-client-*
          path: release-artifacts

      - name: Attest build provenance
        if: ${{ !contains(github.ref_name, '-pre') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          make_latest: ${{ !contains(github.ref_name, '-pre') }}
          files: release-artifacts/**/*
