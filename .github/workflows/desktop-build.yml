name: build-desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (manual runs only; tag pushes build all)
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - windows-arm64
          - macos
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    uses: ./.github/workflows/desktop-build-platform.yml
    with:
      # 22.04 so the AppImage runs on distros with an older glibc
      os: ubuntu-22.04
      artifact_name: linux
      dist_script: dist:linux
      artifact_path: target/release/bundle/appimage/*.AppImage

  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/desktop-build-platform.yml
    with:
      os: windows-latest
      artifact_name: windows
      dist_script: dist:win
      artifact_path: target/release/bundle/nsis/*.zip

  build-windows-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows-arm64'
    uses: ./.github/workflows/desktop-build-platform.yml
    with:
      os: windows-11-arm
      artifact_name: windows-arm64
      dist_script: dist:win
      artifact_path: target/release/bundle/nsis/*.zip

  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    uses: ./.github/workflows/desktop-build-platform.yml
    with:
      os: macos-latest
      artifact_name: macos
      dist_script: dist:mac
      artifact_path: target/release/bundle/dmg/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-windows-arm64, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plotly-client-*
          path: release-artifacts

      - name: Attest build provenance
        if: ${{ !contains(github.ref_name, '-pre') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          make_latest: ${{ !contains(github.ref_name, '-pre') }}
          files: release-artifacts/**/*
