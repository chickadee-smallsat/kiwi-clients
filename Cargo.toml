[workspace]
resolver = "2"
members = ["udp-dummy-server", "plotly-client"]

[workspace.dependencies]
kiwi-measurements = { version = "0.3", default-features = false }

# btleplug 0.13.5 with a CoreBluetooth fix: a device rediscovered after a
# disconnect gets a fresh Peripheral (see vendor/btleplug/KIWI-PATCH.md)
[patch.crates-io]
btleplug = { path = "vendor/btleplug" }
