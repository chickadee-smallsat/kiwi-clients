[package]
name = "kiwi-plotter"
version = "0.1.0"
description = "Kiwi Plotter desktop app: plotly-client in a Tauri window"
edition = "2024"
publish = false

[[bin]]
name = "kiwi-plotter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
plotly-client = { path = "../../plotly-client" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
env_logger = "0.11"
log = "0.4"
